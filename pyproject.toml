[project]
name = "kiara"
version = "0.1.0"
description = "Kiara — a research-driven, scalable foundation model built from first principles."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
benchmark = [
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kiara*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]