[project]
name = "kiara"
version = "0.1.0"
description = "Kiara — a research-driven, scalable foundation model built from first principles."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kiara*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]